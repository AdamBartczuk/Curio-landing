<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curio | Discover Spontaneously</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              curio: {
                cream: '#FFF9F0',      // Warm background
                green: '#005C45',      // Forest green (Primary)
                'green-dark': '#00382B', // Text color
                orange: '#FF5C35',     // Vibrant orange (Accent)
                yellow: '#FDBF11',     // Sticker/Highlight yellow
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['Bricolage Grotesque', 'system-ui', 'sans-serif'],
            },
            borderRadius: {
              '4xl': '2rem',
              '5xl': '2.5rem',
            },
            keyframes: {
              breathe: {
                '0%, 100%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(1.05)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              'float-slow': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-15px)' },
              },
              'float-delayed': {
                '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                '50%': { transform: 'translateY(-10px) rotate(2deg)' },
              },
              pop: {
                '0%': { transform: 'scale(0.9)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              'tilt-n-bounce': {
                '0%, 100%': { transform: 'rotate(0deg) translateY(0)' },
                '5%': { transform: 'rotate(6deg) translateY(-6px)' },
                '10%': { transform: 'rotate(-6deg) translateY(0)' },
                '15%': { transform: 'rotate(6deg) translateY(-3px)' },
                '20%': { transform: 'rotate(0deg) translateY(0)' }
              }
            },
            animation: {
              breathe: 'breathe 2s ease-in-out infinite',
              float: 'float 6s ease-in-out infinite',
              'float-slow': 'float-slow 8s ease-in-out infinite',
              'float-delayed': 'float-delayed 7s ease-in-out infinite',
              'pop': 'pop 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'tilt-n-bounce': 'tilt-n-bounce 5s ease-in-out infinite',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #FFF9F0;
        color: #00382B;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Bricolage Grotesque', sans-serif;
      }
      
      .texture-grain {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
        background-size: 100px;
        background-repeat: repeat;
      }

      .grain-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        opacity: 0.12;
      }
      
      /* Utilities for map animations */
      @keyframes dash {
        to {
          stroke-dashoffset: 0;
        }
      }
      .animate-dash {
        animation: dash 1.5s linear forwards;
      }
      @keyframes float-up {
        0% { transform: translateY(10px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      .animate-float-up {
        animation: float-up 0.4s ease-out forwards;
      }
      @keyframes pulse-ring {
        0% { transform: scale(0.8); opacity: 0.5; }
        100% { transform: scale(1.5); opacity: 0; }
      }
      .animate-pulse-ring {
        animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
